# Dependency update monitoring.
#
# The requirements files pin exact versions on purpose, so nothing here
# loosens them: Dependabot opens a pull request proposing a new pin, and that
# pull request has to pass the same CI as any other change -- the tests, the
# Vercel package check and the production image build included. Nothing
# merges on its own; every update is reviewed and merged by hand.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
