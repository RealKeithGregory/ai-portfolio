name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The embedding model (~90 MB) is downloaded on first use; cache it
      # between runs so the test job stays fast.
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate blog posts
        run: python -m blog

      - name: Check syntax
        run: python -m compileall -q server.py content.py blog.py search.py tests

      - name: Run tests
        run: python -m pytest -q
