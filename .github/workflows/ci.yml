name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate blog posts
        run: python -m blog

      - name: Check syntax
        run: python -m compileall -q server.py config.py security.py content.py blog.py tests

      - name: Run tests
        run: python -m pytest -q

  # Builds what Vercel runs. The project uses Vercel's FastAPI preset with no
  # build step: it installs requirements.txt on the Python version in
  # .python-version and serves server:app. This job does the same in a clean
  # virtual environment, then starts the app in its production configuration.
  # A dependency that will not install, a bundle that outgrows the standard
  # function size, or a production-only setting that breaks the site is caught
  # here instead of at deploy time.
  vercel-package:
    name: Vercel function package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned by .python-version, which is also what Vercel reads.
          python-version-file: .python-version

      - name: Install exactly what Vercel installs
        run: |
          python -m venv /tmp/function
          /tmp/function/bin/pip install --no-cache-dir -r requirements.txt

      # Vercel's standard limit for a Python function is 500 MB uncompressed.
      # Past it, the deployment silently moves to the large-functions path.
      - name: Dependencies fit a standard function
        run: |
          size=$(du -sm /tmp/function/lib/python*/site-packages | cut -f1)
          echo "installed dependencies: ${size} MB"
          test "$size" -lt 500 || { echo "over Vercel's 500 MB standard limit"; exit 1; }

      - name: The app serves its production configuration
        env:
          APP_ENV: production
        run: |
          /tmp/function/bin/python -m uvicorn server:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/ && break
            sleep 1
          done
          status() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          echo "--- pages and assets ---"
          for path in / /blog /static/css/styles.css /static/js/site.js; do
            test "$(status http://127.0.0.1:8000$path)" = "200" || { echo "$path"; exit 1; }
          done
          test "$(status http://127.0.0.1:8000/not-a-page)" = "404"
          echo "--- production disables the interactive docs ---"
          for path in /docs /redoc /openapi.json; do
            test "$(status http://127.0.0.1:8000$path)" = "404" || { echo "$path"; exit 1; }
          done
          echo "--- security headers, HSTS included ---"
          headers=$(curl -sS -D - -o /dev/null http://127.0.0.1:8000/)
          for header in content-security-policy x-content-type-options x-frame-options \
                        referrer-policy permissions-policy strict-transport-security; do
            echo "$headers" | grep -qi "^$header:" || { echo "missing $header"; exit 1; }
          done
          echo "all checks passed"
