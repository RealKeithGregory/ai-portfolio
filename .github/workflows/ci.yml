name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The embedding model (~87 MB) is downloaded on first use; cache it
      # between runs so the test job stays fast. The key carries the pinned
      # revision from search.py, so changing the pin fetches the new weights.
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-1110a243fdf4706b3f48f1d95db1a4f5529b4d41

      # The CPU build, as the deployed image uses. The default PyPI wheel
      # pulls ~2 GB of CUDA libraries that no runner or Cloud Run instance
      # here can use. Installed first so the pinned set below finds it
      # already satisfied.
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate blog posts
        run: python -m blog

      - name: Check syntax
        run: python -m compileall -q server.py config.py security.py content.py blog.py search.py tests

      - name: Run tests
        run: python -m pytest -q

  # Builds the function Vercel actually runs. Vercel installs the CPU build of
  # PyTorch and then runs vercel_build.py, which bakes the pinned model into
  # the bundle; this job does the same two steps and then proves the result
  # serves with no network and no Hugging Face cache but the baked one. A
  # dependency that will not install, a model that fails to bake, or a symlink
  # that would not survive bundling is caught here instead of at deploy time.
  vercel-package:
    name: Vercel function package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          # Pinned by .python-version, which is also what Vercel reads.
          python-version-file: .python-version

      # Runs vercel.json's own installCommand rather than a copy of it, so
      # this job cannot drift from what the platform actually does.
      - name: Install exactly what Vercel installs
        run: |
          install=$(python -c "import json; print(json.load(open('vercel.json'))['installCommand'])")
          echo "vercel.json installCommand: $install"
          eval "$install"

      - name: PyTorch is the CPU build, not the CUDA one
        run: |
          python -c "
          import torch
          print('torch', torch.__version__)
          assert torch.__version__.endswith('+cpu'), torch.__version__
          "

      # Likewise the build command, read from vercel.json.
      - name: Bake the model into the bundle
        run: |
          build=$(python -c "import json; print(json.load(open('vercel.json'))['buildCommand'])")
          echo "vercel.json buildCommand: $build"
          eval "$build"

      - name: The bundle carries real files, not symlinks
        run: |
          test -d hf-cache
          count=$(find hf-cache -type l | wc -l)
          test "$count" -eq 0 || { echo "$count symlink(s) in hf-cache"; exit 1; }
          echo "hf-cache is $(du -sm hf-cache | cut -f1) MB, no symlinks"

      - name: The app serves offline from the baked bundle alone
        # HOME is moved aside so the only Hugging Face cache reachable is the
        # one vercel_build.py just wrote. With HF_HUB_OFFLINE=1 a download is
        # impossible, so a search that returns results proves the bundle is
        # self-contained -- which is what the function relies on at runtime.
        env:
          HF_HUB_OFFLINE: "1"
          APP_ENV: production
        run: |
          mkdir -p /tmp/empty-home
          HOME=/tmp/empty-home python -m uvicorn server:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/ && break
            sleep 2
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = "200"
          echo "--- a real search, offline, from the baked weights ---"
          body=$(curl -sS -X POST http://127.0.0.1:8000/api/search \
            -H 'Content-Type: application/json' -d '{"query":"semantic search"}')
          echo "$body" | python -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['results'], 'no results'
          print('top result:', d['results'][0]['section'], d['results'][0]['score'])
          "
          echo "--- production still disables the interactive docs ---"
          for path in /docs /redoc /openapi.json; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000$path)" = "404"
          done

  # Builds the image Cloud Run actually runs. This job needs no Google Cloud
  # credentials and pushes nothing: it only proves the image can be built and
  # started, so a broken Dockerfile, a dependency that will not install, or a
  # model that fails to bake in is caught here instead of at deploy time.
  image:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ai-portfolio:ci
          # Layer cache, so only the layers that changed are rebuilt. The
          # PyTorch install is the expensive one and rarely changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Model is baked into the image
        run: |
          docker run --rm ai-portfolio:ci \
            sh -c 'test -d /opt/hf-cache/hub/models--sentence-transformers--all-MiniLM-L6-v2'
          echo "model directory present"

      - name: Model loads with no network at all
        # --network none is the real test of HF_HUB_OFFLINE: if anything still
        # reached for the Hugging Face Hub at runtime, this step could not pass.
        run: |
          docker run --rm --network none ai-portfolio:ci python -c "
          import search
          model = search.load_model()
          print('loaded', search.MODEL_NAME, 'at', search.MODEL_REVISION[:12])
          print('embedding shape', model.encode(['portfolio'], normalize_embeddings=True).shape)
          "

      - name: Container starts and serves production configuration
        run: |
          docker run -d --name ci-check -p 8080:8080 ai-portfolio:ci
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            sleep 2
          done
          echo "--- homepage and API ---"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/blog)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/search \
            -H 'Content-Type: application/json' -d '{"query":"evaluation"}')" = "200"
          echo "--- production disables the interactive docs ---"
          for path in /docs /redoc /openapi.json; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080$path)" = "404"
          done
          echo "--- security headers are present ---"
          headers=$(curl -sS -D - -o /dev/null http://localhost:8080/)
          for header in content-security-policy x-content-type-options x-frame-options \
                        referrer-policy permissions-policy strict-transport-security; do
            echo "$headers" | grep -qi "^$header:" || { echo "missing $header"; exit 1; }
          done
          echo "all checks passed"

      - name: Container logs
        if: always()
        run: docker logs ci-check 2>&1 | tail -20 || true

      - name: Stop container
        if: always()
        run: docker rm -f ci-check || true
