{# One blog post preview. Used by the homepage and the blog index. #}
<article class="post-card fade-up">
  <div class="log-date">{{ post.date_display }} · {{ post.reading_minutes }} min read</div>
  <h3 class="log-title"><a href="{{ post.url }}">{{ post.title }}</a></h3>
  <p class="log-text">{{ post.description }}</p>
  {% if post.tags %}
  <ul class="tech-tags" aria-label="Tags">
    {% for tag in post.tags %}<li class="tag">{{ tag }}</li>{% endfor %}
  </ul>
  {% endif %}
  <a href="{{ post.url }}" class="read-link" aria-label="Read article: {{ post.title }}">Read article →</a>
</article>
