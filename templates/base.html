<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}{{ profile.name }} · {{ profile.headline }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ profile.name }} builds, evaluates, and documents AI systems: RAG and retrieval, agents and tool use, guardrails, observability, and financial AI.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23080c10'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='17' fill='%2300ffb4'%3EKG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/styles.css?v={{ asset_version }}">
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>

<!-- Neural Net Background -->
<canvas id="neural-bg" aria-hidden="true"></canvas>

<nav aria-label="Primary">
  <a href="/" class="nav-logo" aria-label="{{ profile.name }}, home">K<span>.</span>G</a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">Menu</button>
  <ul class="nav-links" id="nav-links">
    <li><a href="/#projects">Projects</a></li>
    <li><a href="/blog"{% if active == 'blog' %} aria-current="page"{% endif %}>Blog</a></li>
    <li><a href="/#about">About</a></li>
    <li><a href="{{ profile.links.github }}" target="_blank" rel="noopener">GitHub</a></li>
    <li><a href="/#contact">Contact</a></li>
  </ul>
</nav>

<main id="main"{% if centered_page %} class="centered-page"{% endif %}>
{% block content %}{% endblock %}
</main>

<footer>
  <p>Built by <span>{{ profile.name }}</span>. Powered by <span>Python + FastAPI</span> &amp; curiosity</p>
</footer>

{% block widgets %}{% endblock %}

<script src="/static/js/site.js?v={{ asset_version }}"></script>
</body>
</html>
